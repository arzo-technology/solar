<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="MPPT charge controller">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F6EE"/>
      <stop offset="1" stop-color="#DBE7D8"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.78" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset=".6" stop-color="#E6EAE3"/>
      <stop offset="1" stop-color="#FDFCF8"/>
    </linearGradient>
    <linearGradient id="cfins" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98A29B"/>
      <stop offset="1" stop-color="#C4CCC3"/>
    </linearGradient>
    <linearGradient id="clcd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14352B"/>
      <stop offset="1" stop-color="#0A1F19"/>
    </linearGradient>
    <filter id="cshadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#0E4A38" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#cbg)"/>
  <rect width="800" height="600" fill="url(#cglow)"/>

  <ellipse cx="400" cy="512" rx="176" ry="22" fill="#0E4A38" opacity=".13"/>

  <!-- heatsink fins -->
  <g fill="url(#cfins)">
    <rect x="292" y="150" width="216" height="12" rx="4"/>
    <rect x="292" y="168" width="216" height="12" rx="4"/>
    <rect x="292" y="186" width="216" height="12" rx="4"/>
  </g>

  <!-- body -->
  <rect x="276" y="206" width="248" height="274" rx="18" fill="url(#cbody)" filter="url(#cshadow)"/>
  <rect x="276" y="206" width="248" height="274" rx="18" fill="none" stroke="#B9C3B8" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- lcd -->
  <rect x="300" y="230" width="200" height="104" rx="10" fill="url(#clcd)"/>
  <rect x="300" y="230" width="200" height="104" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="314" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="10" letter-spacing="1.6" fill="#7E9A8C">SOLAR INPUT</text>
  <text x="314" y="284" font-family="Sora, Inter, sans-serif" font-size="26" font-weight="600" fill="#C9F25E">60.2V</text>
  <text x="404" y="284" font-family="Sora, Inter, sans-serif" font-size="20" font-weight="600" fill="#F2F6F0">12.4A</text>
  <g fill="#C9F25E" opacity=".75">
    <rect x="314" y="302" width="9" height="18" rx="2.5"/>
    <rect x="328" y="296" width="9" height="24" rx="2.5"/>
    <rect x="342" y="306" width="9" height="14" rx="2.5"/>
    <rect x="356" y="292" width="9" height="28" rx="2.5"/>
    <rect x="370" y="300" width="9" height="20" rx="2.5"/>
  </g>

  <!-- buttons -->
  <g>
    <circle cx="322" cy="366" r="13" fill="#E8ECE6" stroke="#C3CCC2" stroke-width="1.5"/>
    <path d="M318 366h8M322 362v8" stroke="#5B6B64" stroke-width="2" stroke-linecap="round"/>
    <circle cx="360" cy="366" r="13" fill="#E8ECE6" stroke="#C3CCC2" stroke-width="1.5"/>
    <path d="M356 366h8" stroke="#5B6B64" stroke-width="2" stroke-linecap="round"/>
    <circle cx="398" cy="366" r="13" fill="#E8ECE6" stroke="#C3CCC2" stroke-width="1.5"/>
    <path d="M394 366h8M398 362v8" stroke="#5B6B64" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- terminals -->
  <g>
    <rect x="300" y="410" width="200" height="44" rx="8" fill="#E4E9E1"/>
    <circle cx="326" cy="432" r="8" fill="#3A4640"/>
    <circle cx="366" cy="432" r="8" fill="#3A4640"/>
    <circle cx="406" cy="432" r="8" fill="#3A4640"/>
    <circle cx="446" cy="432" r="8" fill="#3A4640"/>
  </g>
</svg>
