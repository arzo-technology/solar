<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Hybrid solar inverter">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F7EF"/>
      <stop offset="1" stop-color="#DEE9DB"/>
    </linearGradient>
    <radialGradient id="iglow" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ibody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EDF0EB"/>
      <stop offset="1" stop-color="#D5DCD4"/>
    </linearGradient>
    <linearGradient id="iside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3CCC2"/>
      <stop offset="1" stop-color="#E7ECE5"/>
    </linearGradient>
    <linearGradient id="iscreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D241F"/>
      <stop offset="1" stop-color="#06110E"/>
    </linearGradient>
    <filter id="ishadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#0E4A38" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#ibg)"/>
  <rect width="800" height="600" fill="url(#iglow)"/>

  <ellipse cx="400" cy="520" rx="176" ry="24" fill="#0E4A38" opacity=".13"/>

  <!-- wall mount plate -->
  <rect x="252" y="112" width="296" height="368" rx="22" fill="#0E4A38" opacity=".07"/>

  <!-- inverter body -->
  <rect x="272" y="128" width="256" height="352" rx="24" fill="url(#iside)"/>
  <rect x="272" y="128" width="240" height="352" rx="24" fill="url(#ibody)" filter="url(#ishadow)"/>

  <!-- top vent slots -->
  <g stroke="#B9C3B8" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M300 158h184M300 170h184M300 182h184"/>
  </g>

  <!-- screen -->
  <rect x="300" y="206" width="184" height="118" rx="12" fill="url(#iscreen)"/>
  <rect x="300" y="206" width="184" height="118" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="318" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="13" letter-spacing="1.6" fill="#7E9A8C">PV POWER</text>
  <text x="318" y="284" font-family="Sora, Inter, sans-serif" font-size="40" font-weight="600" fill="#C9F25E">5.0</text>
  <text x="392" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#8FB3A2">kW</text>
  <g fill="#C9F25E" opacity=".85">
    <rect x="318" y="300" width="26" height="6" rx="3"/>
    <rect x="350" y="300" width="16" height="6" rx="3" opacity=".55"/>
    <rect x="372" y="300" width="10" height="6" rx="3" opacity=".35"/>
  </g>

  <!-- status LEDs -->
  <g>
    <circle cx="308" cy="352" r="5" fill="#3DDC84"/>
    <circle cx="326" cy="352" r="5" fill="#C9F25E" opacity=".7"/>
    <circle cx="344" cy="352" r="5" fill="#7E9A8C" opacity=".4"/>
  </g>

  <!-- lower grille -->
  <g fill="#CBD3C9" opacity=".75">
    <rect x="300" y="382" width="184" height="5" rx="2.5"/>
    <rect x="300" y="396" width="184" height="5" rx="2.5"/>
    <rect x="300" y="410" width="184" height="5" rx="2.5"/>
    <rect x="300" y="424" width="184" height="5" rx="2.5"/>
    <rect x="300" y="438" width="184" height="5" rx="2.5"/>
  </g>

  <!-- cable glands -->
  <g fill="#3A4640">
    <rect x="292" y="470" width="18" height="12" rx="5"/>
    <rect x="318" y="470" width="18" height="12" rx="5"/>
    <rect x="344" y="470" width="18" height="12" rx="5"/>
  </g>

  <!-- brand strip -->
  <rect x="272" y="444" width="240" height="3" fill="#0E4A38" opacity=".25"/>
</svg>
