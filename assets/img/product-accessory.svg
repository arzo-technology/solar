<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Solar cable and MC4 connectors">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F7EF"/>
      <stop offset="1" stop-color="#DCE8D9"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="abody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4640"/>
      <stop offset=".5" stop-color="#1D2622"/>
      <stop offset="1" stop-color="#0E1512"/>
    </linearGradient>
    <linearGradient id="acable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39443E"/>
      <stop offset="1" stop-color="#101815"/>
    </linearGradient>
    <filter id="ashadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0E4A38" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#abg)"/>
  <rect width="800" height="600" fill="url(#aglow)"/>

  <ellipse cx="400" cy="512" rx="200" ry="22" fill="#0E4A38" opacity=".1"/>

  <!-- cable -->
  <path d="M244 296C176 330 196 438 400 438s228-108 156-142"
        fill="none" stroke="url(#acable)" stroke-width="17" stroke-linecap="round"/>
  <path d="M244 296C176 330 196 438 400 438s228-108 156-142"
        fill="none" stroke="#5B6861" stroke-width="3" stroke-linecap="round" opacity=".55"
        transform="translate(0 -3)"/>

  <!-- cable clip -->
  <rect x="330" y="422" width="30" height="14" rx="5" fill="#C9D2CB"/>
  <rect x="444" y="422" width="30" height="14" rx="5" fill="#C9D2CB"/>

  <!-- left connector -->
  <g filter="url(#ashadow)">
    <rect x="196" y="274" width="76" height="46" rx="13" fill="url(#abody)"/>
    <g stroke="#4C5A53" stroke-width="2.2" opacity=".8">
      <path d="M212 282v30M222 282v30M232 282v30"/>
    </g>
    <rect x="272" y="280" width="16" height="34" rx="6" fill="#39443E"/>
    <rect x="288" y="290" width="12" height="14" rx="4" fill="#C9D2CB"/>
    <circle cx="296" cy="297" r="3" fill="#0E1512"/>
  </g>

  <!-- right connector -->
  <g filter="url(#ashadow)">
    <rect x="528" y="274" width="76" height="46" rx="13" fill="url(#abody)"/>
    <g stroke="#8E3B2E" stroke-width="2.2" opacity=".9">
      <path d="M568 282v30M578 282v30M588 282v30"/>
    </g>
    <rect x="512" y="280" width="16" height="34" rx="6" fill="#8E3B2E"/>
    <rect x="500" y="290" width="12" height="14" rx="4" fill="#C9D2CB"/>
    <circle cx="504" cy="297" r="3" fill="#0E1512"/>
  </g>

  <!-- spec ticks -->
  <g stroke="#0E4A38" stroke-width="2" stroke-linecap="round" opacity=".35">
    <path d="M344 150h112M344 143v14M456 143v14"/>
  </g>
  <text x="400" y="136" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="13" letter-spacing="2" fill="#5B6B64">6 mm² · 1500 V DC</text>
</svg>
