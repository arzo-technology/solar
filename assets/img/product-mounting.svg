<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Solar mounting rails and clamps">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F7F0"/>
      <stop offset="1" stop-color="#DCE8D9"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.22" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F1"/>
      <stop offset=".45" stop-color="#C9D2C9"/>
      <stop offset="1" stop-color="#9EA9A0"/>
    </linearGradient>
    <linearGradient id="railTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE4DC"/>
    </linearGradient>
    <linearGradient id="mcell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4A63"/>
      <stop offset="1" stop-color="#0D2E41"/>
    </linearGradient>
    <filter id="mshadow" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#0E4A38" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#mbg)"/>
  <rect width="800" height="600" fill="url(#mglow)"/>

  <ellipse cx="400" cy="520" rx="220" ry="24" fill="#0E4A38" opacity=".12"/>

  <!-- uprights -->
  <g fill="url(#rail)">
    <rect x="286" y="300" width="18" height="196" rx="5"/>
    <rect x="496" y="300" width="18" height="196" rx="5"/>
  </g>
  <g fill="#8C978E">
    <rect x="278" y="486" width="34" height="12" rx="4"/>
    <rect x="488" y="486" width="34" height="12" rx="4"/>
  </g>

  <!-- tilted panel -->
  <g transform="rotate(-9 400 300)">
    <rect x="228" y="212" width="344" height="152" rx="10" fill="#0B1B23" opacity=".25"/>
    <rect x="232" y="216" width="336" height="146" rx="9" fill="#20303A"/>
    <rect x="242" y="226" width="316" height="126" rx="6" fill="#0A2331"/>
    <g fill="url(#mcell)">
      <rect x="247" y="231" width="72" height="56" rx="2"/>
      <rect x="324" y="231" width="72" height="56" rx="2"/>
      <rect x="401" y="231" width="72" height="56" rx="2"/>
      <rect x="478" y="231" width="72" height="56" rx="2"/>
      <rect x="247" y="291" width="72" height="56" rx="2"/>
      <rect x="324" y="291" width="72" height="56" rx="2"/>
      <rect x="401" y="291" width="72" height="56" rx="2"/>
      <rect x="478" y="291" width="72" height="56" rx="2"/>
    </g>
    <path d="M232 216h336" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
  </g>

  <!-- rails under panel -->
  <g filter="url(#mshadow)">
    <rect x="240" y="356" width="320" height="16" rx="5" fill="url(#rail)"/>
    <rect x="240" y="356" width="320" height="5" rx="2.5" fill="url(#railTop)"/>
    <rect x="240" y="404" width="320" height="16" rx="5" fill="url(#rail)"/>
    <rect x="240" y="404" width="320" height="5" rx="2.5" fill="url(#railTop)"/>
  </g>

  <!-- clamps + bolts -->
  <g>
    <rect x="286" y="336" width="18" height="26" rx="4" fill="#B7C1B8"/>
    <rect x="496" y="336" width="18" height="26" rx="4" fill="#B7C1B8"/>
    <rect x="286" y="384" width="18" height="26" rx="4" fill="#B7C1B8"/>
    <rect x="496" y="384" width="18" height="26" rx="4" fill="#B7C1B8"/>
  </g>
  <g fill="#7C877E">
    <circle cx="295" cy="349" r="4"/>
    <circle cx="505" cy="349" r="4"/>
    <circle cx="295" cy="397" r="4"/>
    <circle cx="505" cy="397" r="4"/>
  </g>

  <!-- base shadow line -->
  <rect x="250" y="502" width="300" height="2" rx="1" fill="#0E4A38" opacity=".1"/>
</svg>
